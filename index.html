<!DOCTYPE html>
<html lang="el" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f6feb" />
  <title>Εκκρεμείς Πωλήσεις — Dashboard</title>
  <meta name="description" content="Dashboard διαχείρισης εκκρεμών πωλήσεων μεσιτικού γραφείου" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="btn-menu" aria-label="Μενού">
        <span class="burger"></span>
      </button>
      <a class="brand" href="#/dashboard">
        <span class="brand-mark">🏠</span>
        <span class="brand-text">
          <strong id="brand-name">Εκκρεμείς Πωλήσεις</strong>
          <small id="brand-sub">Μεσιτικό Γραφείο</small>
        </span>
      </a>
      <div class="search-wrap">
        <input id="global-search" type="search" placeholder="Αναζήτηση: κωδικός, όνομα, τηλέφωνο..." autocomplete="off" />
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-theme" title="Θέμα" aria-label="Αλλαγή θέματος">🌓</button>
        <button class="btn primary" id="btn-add" title="Νέα υπόθεση">
          <span class="plus">+</span><span class="only-desktop"> Νέα υπόθεση</span>
        </button>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <nav class="nav">
        <a class="nav-item" data-route="dashboard" href="#/dashboard"><span class="ni">📊</span> Dashboard</a>
        <a class="nav-item" data-route="properties" href="#/properties"><span class="ni">🏠</span> Υποθέσεις <span class="badge" id="nav-count-props">0</span></a>
        <a class="nav-item" data-route="tasks" href="#/tasks"><span class="ni">✅</span> Εκκρεμότητες <span class="badge warn" id="nav-count-tasks">0</span></a>
        <a class="nav-item" data-route="settings" href="#/settings"><span class="ni">⚙️</span> Ρυθμίσεις</a>
      </nav>
      <div class="sidebar-foot">
        <div class="sync-status" id="sync-status">
          <span class="dot"></span><span id="sync-text">Φόρτωση…</span>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main" id="main">
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Φόρτωση δεδομένων…</p>
      </div>
    </main>

    <nav class="bottom-nav">
      <a class="bn-item" data-route="dashboard" href="#/dashboard"><span>📊</span><em>Dashboard</em></a>
      <a class="bn-item" data-route="properties" href="#/properties"><span>🏠</span><em>Υποθέσεις</em></a>
      <a class="bn-item" data-route="tasks" href="#/tasks"><span>✅</span><em>Εκκρεμότητες</em></a>
      <a class="bn-item" data-route="settings" href="#/settings"><span>⚙️</span><em>Ρυθμίσεις</em></a>
    </nav>
  </div>

  <div class="modal-root" id="modal-root" aria-hidden="true"></div>
  <div class="toast-root" id="toast-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
