<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    body { width: 360px; margin: 0; font-family: "Segoe UI", Arial, sans-serif; color: #1c2530; background: #f4f6f8; }
    header { background: #234a6d; color: #fff; padding: 12px 14px; }
    header h1 { margin: 0; font-size: 15px; }
    header p { margin: 3px 0 0; font-size: 11.5px; opacity: .85; }
    .body { padding: 12px 14px; }
    p.hint { font-size: 12px; color: #68737f; margin: 0 0 10px; line-height: 1.4; }
    button { width: 100%; border: none; border-radius: 9px; padding: 10px; font-size: 13.5px; font-weight: 700; cursor: pointer; margin-bottom: 8px; }
    #collect { background: #234a6d; color: #fff; }
    #download { background: #b8892b; color: #fff; }
    #copy, #copyText { background: #fff; color: #234a6d; border: 1px solid #cfd8e2; }
    button:disabled { opacity: .5; cursor: default; }
    #status { font-size: 12.5px; margin: 6px 0; min-height: 16px; }
    #status.ok { color: #2f7d4f; }
    #status.err { color: #a63c3c; }
    textarea { width: 100%; height: 120px; font-family: Consolas, monospace; font-size: 11px; border: 1px solid #cfd8e2; border-radius: 8px; padding: 8px; resize: vertical; }
    .row { display: flex; gap: 8px; }
    .row button { margin-bottom: 8px; }
    small { color: #68737f; font-size: 10.5px; display: block; margin-top: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>XE.gr → Αγγελίες</h1>
    <p>Εξαγωγή των αγγελιών σου σε JSON</p>
  </header>
  <div class="body">
    <p class="hint">Άνοιξε πρώτα στο xe.gr τη σελίδα <b>«Οι αγγελίες μου»</b> (θα πρέπει να είσαι συνδεδεμένος), μετά πάτα:</p>
    <button id="collect">🔍 Μάζεψε αγγελίες από τη σελίδα</button>
    <div id="status"></div>
    <textarea id="preview" readonly placeholder="Εδώ θα δεις τις αγγελίες που βρέθηκαν..."></textarea>
    <div class="row" style="margin-top:8px">
      <button id="download">⬇️ Κατέβασε JSON</button>
      <button id="copy">📋 Αντίγραφο</button>
    </div>
    <button id="copyText">📋 Αντίγραφο όλης της σελίδας (για έλεγχο)</button>
    <small>Μετά: στο dashboard → Αγγελίες → Δεδομένα → Επιλογή αρχείου (JSON) ή «Αντικατάσταση όλων».</small>
  </div>
  <script src="popup.js"></script>
</body>
</html>
